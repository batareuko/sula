name: Claude Code

# @claude у коментарі до issue чи PR запускає Claude Code Action. Запити йдуть на Anthropic-сумісний API DeepSeek:
# ключ — у секреті репозиторію DEEPSEEK_API_KEY (Settings → Secrets and variables → Actions), ніколи не в коді.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    env:
      ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.DEEPSEEK_API_KEY }}
      # моделі DeepSeek за їхньою інструкцією для Claude Code (api-docs.deepseek.com): «@claude pro …» — deepseek-v4-pro
      # (сильніша, дорожча), просто «@claude …» — deepseek-v4-flash (швидша, дешевша). Дивимось текст коментаря / рев'ю,
      # а для нового issue — його заголовок і текст.
      ANTHROPIC_MODEL: ${{ contains(github.event.comment.body || github.event.review.body || format('{0} {1}', github.event.issue.title, github.event.issue.body), '@claude pro') && 'deepseek-v4-pro' || 'deepseek-v4-flash' }}
      ANTHROPIC_DEFAULT_OPUS_MODEL: deepseek-v4-pro
      ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ contains(github.event.comment.body || github.event.review.body || format('{0} {1}', github.event.issue.title, github.event.issue.body), '@claude pro') && 'deepseek-v4-pro' || 'deepseek-v4-flash' }}
      ANTHROPIC_DEFAULT_HAIKU_MODEL: deepseek-v4-flash
      CLAUDE_CODE_SUBAGENT_MODEL: deepseek-v4-flash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
