name: Deploy aion2-guide to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'aion2-guide/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Статичний сайт без збірки: публікуємо папку як є, без серверних файлів Supabase
      - name: Prepare site
        run: |
          mkdir _site
          cp -r aion2-guide/. _site/
          rm -rf _site/supabase _site/schema.sql _site/cron.sql _site/README.md _site/tools
          # Короткі сторінки пачноутів /p/<id>/ з прев'ю для Discord
          node aion2-guide/tools/patch-pages.mjs _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
